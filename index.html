<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аккорды для фортепиано</title>
<style>
:root{
  --bg:#f6f4f0; --card:#ffffff; --ink:#1c1a17; --sub:#6b6560;
  --accent:#c2542e; --accent2:#2e6f5e; --steel:#2e6f5e; --ghost:rgba(120,114,105,0.4); --line:#e4dfd6; --white-key:#fffdf9; --black-key:#1c1a17;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151311; --card:#1e1b18; --ink:#f2ede6; --sub:#a89f93;
    --accent:#e2764b; --accent2:#4fa88f; --steel:#4fa88f; --ghost:rgba(170,163,153,0.35); --line:#332e29; --white-key:#e9e4db; --black-key:#0b0a09;
  }
}
:root[data-theme="dark"]{
  --bg:#151311; --card:#1e1b18; --ink:#f2ede6; --sub:#a89f93;
  --accent:#e2764b; --accent2:#4fa88f; --steel:#4fa88f; --ghost:rgba(170,163,153,0.35); --line:#332e29; --white-key:#e9e4db; --black-key:#0b0a09;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Iowan Old Style','Georgia',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; justify-content:center;
}
.wrap{width:100%; max-width:760px; padding:32px 20px 48px;}
h1{font-size:1.5rem; margin:0 0 4px; letter-spacing:.02em;}
p.lead{color:var(--sub); margin:0 0 24px; font-size:.95rem;}
.inputRow{display:flex; gap:10px; margin-bottom:14px;}
.inputWrap{position:relative; flex:1;}
input#chordInput{
  width:100%; font-family:inherit; font-size:1.15rem; padding:12px 14px;
  border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink);
}
input#chordInput:focus{outline:2px solid var(--accent);}
.suggestions{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.18); max-height:230px; overflow-y:auto; z-index:30; display:none;
}
.suggestions.show{display:block;}
.suggestion-item{padding:9px 14px; cursor:pointer; font-size:1rem; border-bottom:1px solid var(--line);}
.suggestion-item:last-child{border-bottom:none;}
.suggestion-item:hover, .suggestion-item.active{background:var(--bg); color:var(--accent);}
button#go{
  font-family:inherit; font-size:1rem; padding:12px 20px; border-radius:10px; border:none;
  background:var(--accent); color:#fff; cursor:pointer;
}
button#go:active{opacity:.85;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
.chip{
  font-size:.82rem; padding:5px 11px; border-radius:999px; border:1px solid var(--line);
  color:var(--sub); cursor:pointer; background:transparent;
}
.chip:hover{border-color:var(--accent); color:var(--accent);}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; min-height:60px;}
.chordName{font-size:1.7rem; margin:0 0 2px;}
.chordName .root{color:var(--accent);}
.formula{color:var(--sub); font-size:1rem; margin:4px 0 20px;}
.formula b{color:var(--accent2); font-weight:600;}
.legend{color:var(--sub); font-size:.82rem; margin-top:10px; font-style:italic;}
.pianoScroll{overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
svg{display:block;}
.err{color:var(--accent); font-size:.95rem;}
.notesRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.noteTag{
  font-size:.85rem; padding:4px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line);
}
.noteTag b{color:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Аккорды для фортепиано</h1>
  <p class="lead">Введите название аккорда — увидите формулу по ступеням и схему на клавиатуре.</p>
  <div class="inputRow">
    <div class="inputWrap">
      <input id="chordInput" placeholder="Например: D#dim7" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button id="go">Показать</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="card" id="result"><span class="err">Начните вводить аккорд выше — например A, Cm7, D#dim7, Fmaj7, Bm7b5, G7sus4, C#add9.</span></div>
</div>

<script>
const NOTE_BASE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const CHORDS = {
  major:  {name:'мажор', degrees:['1','3','5'], semis:[0,4,7], base:'major'},
  m:      {name:'минор', degrees:['1','♭3','5'], semis:[0,3,7], base:'minor'},
  5:      {name:'квинтаккорд (пауэр-аккорд)', degrees:['1','5'], semis:[0,7], base:null},
  dim:    {name:'уменьшённый', degrees:['1','♭3','♭5'], semis:[0,3,6], base:'minor'},
  aug:    {name:'увеличенный', degrees:['1','3','♯5'], semis:[0,4,8], base:'major'},
  dim7:   {name:'уменьшённый септаккорд', degrees:['1','♭3','♭5','𝄫7'], semis:[0,3,6,9], base:'minor'},
  m7b5:   {name:'полууменьшённый (м7♭5)', degrees:['1','♭3','♭5','♭7'], semis:[0,3,6,10], base:'minor'},
  7:      {name:'доминантсептаккорд', degrees:['1','3','5','♭7'], semis:[0,4,7,10], base:'major'},
  maj7:   {name:'большой мажорный септаккорд', degrees:['1','3','5','7'], semis:[0,4,7,11], base:'major'},
  m7:     {name:'малый минорный септаккорд', degrees:['1','♭3','5','♭7'], semis:[0,3,7,10], base:'minor'},
  6:      {name:'секстаккорд', degrees:['1','3','5','6'], semis:[0,4,7,9], base:'major'},
  m6:     {name:'минорный секстаккорд', degrees:['1','♭3','5','6'], semis:[0,3,7,9], base:'minor'},
  '6/9':  {name:'6/9', degrees:['1','3','5','6','9'], semis:[0,4,7,9,14], base:'major'},
  sus2:   {name:'суспендированный 2', degrees:['1','2','5'], semis:[0,2,7], base:'major'},
  sus4:   {name:'суспендированный 4', degrees:['1','4','5'], semis:[0,5,7], base:'major'},
  '7sus4':{name:'доминант 7 sus4', degrees:['1','4','5','♭7'], semis:[0,5,7,10], base:'major'},
  add9:   {name:'add9', degrees:['1','3','5','9'], semis:[0,4,7,14], base:'major'},
  madd9:  {name:'минорный add9', degrees:['1','♭3','5','9'], semis:[0,3,7,14], base:'minor'},
  add11:  {name:'add11', degrees:['1','3','5','11'], semis:[0,4,7,17], base:'major'},
  add2:   {name:'add2', degrees:['1','2','3','5'], semis:[0,2,4,7], base:'major'},
  9:      {name:'нонаккорд доминантовый', degrees:['1','3','5','♭7','9'], semis:[0,4,7,10,14], base:'major'},
  maj9:   {name:'большой мажорный нонаккорд', degrees:['1','3','5','7','9'], semis:[0,4,7,11,14], base:'major'},
  m9:     {name:'минорный нонаккорд', degrees:['1','♭3','5','♭7','9'], semis:[0,3,7,10,14], base:'minor'},
  11:     {name:'ундецимаккорд доминантовый', degrees:['1','3','5','♭7','9','11'], semis:[0,4,7,10,14,17], base:'major'},
  m11:    {name:'минорный ундецимаккорд', degrees:['1','♭3','5','♭7','9','11'], semis:[0,3,7,10,14,17], base:'minor'},
  13:     {name:'терцдецимаккорд доминантовый', degrees:['1','3','5','♭7','9','11','13'], semis:[0,4,7,10,14,17,21], base:'major'},
  m13:    {name:'минорный терцдецимаккорд', degrees:['1','♭3','5','♭7','9','11','13'], semis:[0,3,7,10,14,17,21], base:'minor'},
  '7#5':  {name:'доминант 7♯5', degrees:['1','3','♯5','♭7'], semis:[0,4,8,10], base:'major'},
  '7b5':  {name:'доминант 7♭5', degrees:['1','3','♭5','♭7'], semis:[0,4,6,10], base:'major'},
  '7b9':  {name:'доминант 7♭9', degrees:['1','3','5','♭7','♭9'], semis:[0,4,7,10,13], base:'major'},
  '7#9':  {name:'доминант 7♯9', degrees:['1','3','5','♭7','♯9'], semis:[0,4,7,10,15], base:'major'},
  '7#11': {name:'доминант 7♯11', degrees:['1','3','5','♭7','♯11'], semis:[0,4,7,10,18], base:'major'},
  'maj7#5':{name:'мажорный 7♯5', degrees:['1','3','♯5','7'], semis:[0,4,8,11], base:'major'},
  'maj7b5':{name:'мажорный 7♭5', degrees:['1','3','♭5','7'], semis:[0,4,6,11], base:'major'},
};

function getGhosts(chord){
  if(!chord.base) return [];
  const triad = chord.base==='major' ? [{sem:4,label:'3'},{sem:7,label:'5'}] : [{sem:3,label:'♭3'},{sem:7,label:'5'}];
  return triad.filter(t=>!chord.semis.includes(t.sem));
}

function isAltered(chord, sem, label){
  if(!chord.base) return false;
  const triadSemis = chord.base==='major' ? [0,4,7] : [0,3,7];
  return !triadSemis.includes(sem);
}

const AMBIGUOUS = {
  'm':'m','M':'major','-':'m',
  'm6':'m6','M6':'6',
  'm7':'m7','M7':'maj7','-7':'m7',
  'm9':'m9','M9':'maj9','-9':'m9',
  'm11':'m11','M11':'11',
  'm13':'m13','M13':'13',
  'madd9':'madd9','Madd9':'add9'
};

const ALIASES = {
  '':'major','maj':'major','major':'major',
  'dim':'dim','o':'dim','°':'dim',
  'dim7':'dim7','o7':'dim7','°7':'dim7',
  'aug':'aug','+':'aug',
  'aug7':'7#5','7#5':'7#5','7+5':'7#5',
  '7b5':'7b5',
  'm7b5':'m7b5','m7-5':'m7b5','ø':'m7b5','ø7':'m7b5','halfdim':'m7b5','halfdim7':'m7b5',
  '5':'5',
  '6':'6','maj6':'6',
  'm6':'m6','min6':'m6',
  '6/9':'6/9','69':'6/9',
  'sus2':'sus2',
  'sus4':'sus4','sus':'sus4',
  '7sus4':'7sus4','7sus':'7sus4',
  'add9':'add9',
  'madd9':'madd9','minadd9':'madd9',
  'add11':'add11',
  'add2':'add2',
  '7':'7','dom7':'7',
  'maj7':'maj7','δ7':'maj7','δ':'maj7',
  'm7':'m7','min7':'m7',
  '9':'9',
  'maj9':'maj9',
  'm9':'m9','min9':'m9',
  '11':'11',
  'm11':'m11','min11':'m11',
  '13':'13',
  'm13':'m13','min13':'m13',
  '7b9':'7b9',
  '7#9':'7#9',
  '7#11':'7#11',
  'maj7#5':'maj7#5','augmaj7':'maj7#5',
  'maj7b5':'maj7b5'
};

const ALL_CHORDS = [];
(function buildSuggestionList(){
  const roots = ['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B','H'];
  const qualities = ['','m','5','dim','aug','dim7','m7b5','7','maj7','m7','6','m6','6/9','sus2','sus4',
    '7sus4','add9','madd9','add11','add2','9','maj9','m9','11','m11','13','m13','7#5','7b5','7b9','7#9','7#11','maj7#5','maj7b5'];
  roots.forEach(r=>qualities.forEach(q=>ALL_CHORDS.push(r+q)));
})();

function suggestChords(query){
  if(!query) return [];
  const q = query.toLowerCase();
  return ALL_CHORDS.filter(c=>c.toLowerCase().startsWith(q)).slice(0,8);
}
function parseChord(raw){
  const input = raw.trim();
  const m = input.match(/^([A-Ha-h])(#{1,2}|b{1,2}|x)?/);
  if(!m) return null;
  const base = NOTE_BASE[m[1].toUpperCase()];
  const acc = m[2] || '';
  let accVal = 0;
  if(acc==='#') accVal=1; else if(acc==='##'||acc==='x') accVal=2;
  else if(acc==='b') accVal=-1; else if(acc==='bb') accVal=-2;
  const rootIndex = ((base+accVal)%12+12)%12;
  const rootLabel = m[1].toUpperCase() + acc.replace('x','##');
  const qualityRaw = input.slice(m[0].length).trim();
  let key = AMBIGUOUS[qualityRaw];
  if(key===undefined){
    const low = qualityRaw.toLowerCase().replace(/\s+/g,'');
    key = ALIASES[low];
  }
  if(key===undefined || !CHORDS[key]) return {error:true};
  return {rootIndex, rootLabel, chord:CHORDS[key], key};
}

function buildPianoSVG(rootIndex, chord, ghosts){
  const OCTAVES = 3, WHITE_W = 26, WHITE_H = 115, BLACK_W = 16, BLACK_H = 70;
  const whiteOrderInOct = {0:0,2:1,4:2,5:3,7:4,9:5,11:6};
  const blackAfterWhite = {1:1,3:2,6:4,8:5,10:6};
  const totalWhite = OCTAVES*7;
  const svgW = totalWhite*WHITE_W, svgH = WHITE_H+34;
  const chordSet = {};
  chord.semis.forEach((s,i)=>{ chordSet[rootIndex+s] = {label:chord.degrees[i], sem:s}; });
  const ghostSet = {};
  (ghosts||[]).forEach(g=>{ ghostSet[rootIndex+g.sem] = g.label; });
  let whites='', blacks='', labels='';
  for(let oct=0; oct<OCTAVES; oct++){
    for(let pc of [0,2,4,5,7,9,11]){
      const pos = oct*12+pc;
      const wi = oct*7 + whiteOrderInOct[pc];
      const x = wi*WHITE_W;
      const hit = chordSet[pos];
      const ghost = !hit && ghostSet[pos];
      const altered = hit && isAltered(chord, hit.sem, hit.label);
      const fill = hit ? (altered ? 'var(--accent)' : 'var(--steel)') : (ghost ? 'var(--ghost)' : 'var(--white-key)');
      whites += `<rect x="${x}" y="0" width="${WHITE_W-1}" height="${WHITE_H}" rx="4" fill="${fill}" stroke="var(--line)" stroke-width="1"/>`;
      if(hit){
        labels += `<text x="${x+WHITE_W/2}" y="${WHITE_H-13}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Georgia,serif">${hit.label}</text>`;
        labels += `<text x="${x+WHITE_W/2}" y="${WHITE_H-2}" text-anchor="middle" font-size="7" fill="#fff" font-family="Georgia,serif">${NOTE_NAMES[pos%12]}</text>`;
      } else if(ghost){
        labels += `<text x="${x+WHITE_W/2}" y="${WHITE_H-13}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" opacity="0.65" font-family="Georgia,serif">${ghost}</text>`;
      }
    }
    for(let pc of [1,3,6,8,10]){
      const pos = oct*12+pc;
      const wi = oct*7 + blackAfterWhite[pc];
      const x = wi*WHITE_W - BLACK_W/2;
      const hit = chordSet[pos];
      const ghost = !hit && ghostSet[pos];
      const altered = hit && isAltered(chord, hit.sem, hit.label);
      const fill = hit ? (altered ? 'var(--accent)' : 'var(--steel)') : (ghost ? 'var(--ghost)' : 'var(--black-key)');
      blacks += `<rect x="${x}" y="0" width="${BLACK_W}" height="${BLACK_H}" rx="3" fill="${fill}"/>`;
      if(hit){
        blacks += `<text x="${x+BLACK_W/2}" y="${BLACK_H-18}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Georgia,serif">${hit.label}</text>`;
        blacks += `<text x="${x+BLACK_W/2}" y="${BLACK_H-8}" text-anchor="middle" font-size="6.5" fill="#fff" font-family="Georgia,serif">${NOTE_NAMES[pos%12]}</text>`;
      } else if(ghost){
        blacks += `<text x="${x+BLACK_W/2}" y="${BLACK_H-18}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--ink)" opacity="0.7" font-family="Georgia,serif">${ghost}</text>`;
      }
    }
  }
  return `<svg viewBox="0 0 ${svgW} ${WHITE_H}" width="${svgW}" height="${WHITE_H}" xmlns="http://www.w3.org/2000/svg">${whites}${blacks}${labels}</svg>`;
}

function render(raw){
  const result = document.getElementById('result');
  if(!raw.trim()){
    result.innerHTML = '<span class="err">Начните вводить аккорд выше — например A, Cm7, D#dim7, Fmaj7, Bm7b5, G7sus4, C#add9.</span>';
    return;
  }
  const parsed = parseChord(raw);
  if(!parsed || parsed.error){
    result.innerHTML = '<span class="err">Не удалось распознать аккорд «'+raw+'». Попробуйте, например: D#dim7, Cmaj7, Am7b5, G13, F#sus4.</span>';
    return;
  }
  const {rootIndex, rootLabel, chord} = parsed;
  const ghosts = getGhosts(chord);
  const svg = buildPianoSVG(rootIndex, chord, ghosts);
  const formula = chord.degrees.map((d,i)=>{
    const altered = isAltered(chord, chord.semis[i], d);
    return `<b style="color:${altered?'var(--accent)':'var(--steel)'}">${d}</b>`;
  }).join(' — ');
  const notesHtml = chord.semis.map((s,i)=>{
    const noteName = NOTE_NAMES[(rootIndex+s)%12];
    const altered = isAltered(chord, s, chord.degrees[i]);
    return `<span class="noteTag"><b style="color:${altered?'var(--accent)':'var(--steel)'}">${chord.degrees[i]}</b> = ${noteName}</span>`;
  }).join('');
  const legend = ghosts.length
    ? `<div class="legend">Серым — исходная ступень ${chord.base==='major'?'мажорного':'минорного'} трезвучия, от которой отличается этот аккорд.</div>`
    : '';
  result.innerHTML = `
    <div class="chordName"><span class="root">${rootLabel}</span> — ${chord.name}</div>
    <div class="formula">Формула: ${formula}</div>
    <div class="pianoScroll">${svg}</div>
    ${legend}
    <div class="notesRow">${notesHtml}</div>
  `;
}

const chipsData = ['C','Cm7','D#dim7','Fmaj7','G7','Asus4','Bm7b5','C#add9','E13'];
const chipsEl = document.getElementById('chips');
chipsData.forEach(c=>{
  const b = document.createElement('button');
  b.className='chip'; b.textContent=c;
  b.onclick=()=>{ chordInput.value=c; render(c); hideSuggestions(); };
  chipsEl.appendChild(b);
});

const chordInput = document.getElementById('chordInput');
const sugBox = document.getElementById('suggestions');
let activeIndex = -1;

document.getElementById('go').onclick = ()=>{ render(chordInput.value); hideSuggestions(); };

chordInput.addEventListener('input', ()=>{
  renderSuggestions(suggestChords(chordInput.value.trim()));
});

chordInput.addEventListener('keydown', e=>{
  const items = sugBox.querySelectorAll('.suggestion-item');
  if(e.key==='ArrowDown' && items.length){
    e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); updateActive(items);
  } else if(e.key==='ArrowUp' && items.length){
    e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); updateActive(items);
  } else if(e.key==='Enter'){
    if(activeIndex>=0 && items[activeIndex]){
      chordInput.value = items[activeIndex].textContent;
    }
    render(chordInput.value);
    hideSuggestions();
  } else if(e.key==='Escape'){
    hideSuggestions();
  }
});

document.addEventListener('click', e=>{
  if(!e.target.closest('.inputWrap')) hideSuggestions();
});

function renderSuggestions(list){
  activeIndex = -1;
  if(list.length===0){ hideSuggestions(); return; }
  sugBox.innerHTML = list.map(c=>`<div class="suggestion-item">${c}</div>`).join('');
  sugBox.classList.add('show');
  sugBox.querySelectorAll('.suggestion-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      chordInput.value = el.textContent;
      hideSuggestions();
      render(chordInput.value);
    });
  });
}

function hideSuggestions(){
  sugBox.classList.remove('show');
  sugBox.innerHTML = '';
  activeIndex = -1;
}

function updateActive(items){
  items.forEach((it,i)=> it.classList.toggle('active', i===activeIndex));
  if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'});
}
</script>
</body>
</html>
